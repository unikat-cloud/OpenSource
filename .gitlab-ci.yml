# Minimal CI-Config für Skript-Repo
# Dieses Repo enthält nur Skripte und Dokumentation – kein Build/Deploy nötig.

stages:
  - test

lint:
  stage: test
  image: alpine:latest
  script:
    - echo "Prüfe Skript-Dateien auf offensichtliche Fehler..."
    - find . -name "*.bash" -exec sh -c 'bash -n "$1"' _ {} \;
    - find . -name "*.ps1" -exec sh -c 'echo "PS1-Check: $1"' _ {} \;
    - echo "Alle Skripte geprüft."
  only:
    - merge_requests
    - main
